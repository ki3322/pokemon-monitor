name: Pokemon Monitor

on:
  schedule:
    # 每 30 分鐘執行一次
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write

# 同時只允許一個執行：兩個 job 同時推 state.json 會造成 push 被拒，
# 該輪狀態遺失後下一輪會重複發送通知。
concurrency:
  group: pokemon-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # rebase 需要完整歷史
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RSSHUB_INSTANCE: ${{ vars.RSSHUB_INSTANCE }}
          # Notion 為選填：未設定時自動略過同步，不影響 Telegram 通知
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -m src.main

      - name: Commit state changes
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add state.json
          if git diff --staged --quiet; then
            echo "state.json 沒有變動，略過"
            exit 0
          fi
          git commit -m "Update state.json [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 失敗，改以 rebase 重試（第 $attempt 次）"
            git fetch origin main
            # rebase 期間 "theirs" 指的是正在重放的本地 commit，
            # 衝突時保留本輪產生的 state.json
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done

          echo "重試 3 次後仍無法推送 state.json"
          exit 1
